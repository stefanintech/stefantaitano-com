workflows:
  - slug: morning-family-briefing
    title: The Morning Family Briefing
    artifactName: The Taitano Times
    status:
      - Active
    category: Family operations
    tools:
      - Muse
      - Gmail
      - Google Calendar
      - Apple Reminders
    summary: >
      A morning view that pulls the week together: who has what, school and
      after-school stuff, family events, and what still needs to get done.
    question: What does our family need to know and get done this week?
    flow:
      - Calendar
      - Email
      - Reminders
      - Family context
      - Muse
      - Morning briefing
    sections:
      - heading: The problem
        paragraphs:
          - >
            The information wasn't stuck in one bad tool. It lived in Google
            Calendar, Apple Reminders, a paper calendar, regular email, and
            school email. I was the one putting it together.
      - heading: How I use it
        paragraphs:
          - >
            Muse generates it around 6:00 AM. I read it on a screen and pass
            along anything my partner needs. I call the artifact the Taitano
            Times, but I don't print it. Printing might happen later. It isn't
            part of this yet.
          - >
            There is no giant master prompt. I'm playing it by ear and
            correcting it as we go, so it can learn our routines, what to
            skip, and how dense the morning view should be.
      - heading: What's being tuned
        paragraphs:
          - >
            Formatting is sometimes wrong. It includes too much. It makes
            wrong assumptions. Prioritization still needs work. It improves
            when I correct it, not because I wrote one perfect prompt.
      - heading: If it disappeared
        paragraphs:
          - >
            I would go back to Google Calendar, Apple Reminders, a paper
            calendar, and sorting email myself.
    extra:
      summary: What it has to answer
      items:
        - Who has what going on this week?
        - What school and after-school activities are happening?
        - What family events matter?
        - What do the parents need to finish?
        - What forms, due dates, or action items need attention before the week is over?
    artifacts:
      - image: /assets/images/ai/taitano-times-2026-09-20-public.png
        enlarge: true
        alt: >-
          Public-safe edition of the Taitano Times morning briefing with
          sections for Today, This Week, Kids & School, Parents, Out & About,
          news, and a family conversation prompt.
        caption: A real morning briefing with private family details generalized or removed.

  - slug: ruby-reboot
    title: Getting Back Into Ruby Without Starting Over
    status:
      - Active
      - Evolving
    category: Learning
    tools:
      - ChatGPT
      - Notion
      - The Odin Project
    summary: >
      A lightweight reboot so I can pick Ruby back up after a summer break
      without restarting The Odin Project from zero.
    flow:
      - The Odin Project
      - Ruby exercise
      - My attempt
      - ChatGPT pair partner
      - Hints, review, debugging
      - Session summary
      - Notion
      - Next stopping point
    sections:
      - heading: The problem
        paragraphs:
          - >
            I finished The Odin Project Foundations and moved into the
            Full-Stack Ruby on Rails path. I got into the Ruby course around
            nested collections and Enumerable, then mostly stopped over the
            summer, especially after July. Coming back in September, I didn't
            want to restart from the beginning or jump into the exact
            lesson where I left off.
      - heading: How I use it
        paragraphs:
          - >
            I use ChatGPT as a pair-programming partner. I try the problem
            first, then use ChatGPT for hints, code review, debugging, and
            explanations. No instant starter code or the full solution. At
            the end of a session I use the conversation to write down where
            I stopped, so I can pick it back up later.
          - >
            What that note keeps is ordinary: what I practiced, what I
            finished, what was hard, where I stopped, and what likely comes
            next.
      - heading: What's being tuned
        paragraphs:
          - >
            This isn't a polished curriculum, and it isn't a rigid weekly
            accountability system. I learn when time allows. AI doesn't
            make me study every day. It lowers the cost of coming back after
            a break.
      - heading: Where this is going
        paragraphs:
          - >
            Finish the reboot and return to The Odin Project's Ruby path
            without restarting the course.
    extra:
      summary: What I have already practiced
      intro: A record of use, not a Ruby tutorial.
      layout: cluster
      items:
        - variables
        - arrays
        - each
        - map
        - select
        - hashes
        - nested collections
        - filter
        - find
        - debugging
        - p vs puts
        - reject
        - any?
        - all?
        - count
        - sum
        - max_by
        - min_by
        - sort_by
        - group_by
    artifacts:
      - image: /assets/images/ai/ruby-reboot-artifacts.png
        enlarge: true
        fit: true
        alt: Ruby Reboot workflow showing Stefan’s Ruby attempt, a ChatGPT pair-programming hint, and the resulting Notion session summary.
        caption: "A real Ruby Reboot session: my attempt, ChatGPT as a pair-programming partner, and the Notion note that preserves where I stopped."

  - slug: delegating-attention
    title: Delegating Attention
    status:
      - Active
      - Evolving
    category: Monitoring
    tools:
      - Muse
      - Email
      - Push notifications
    summary: >
      Muse watches carrier, flight, school, and similar email, then pings me
      only when something actually needs attention.
    flow:
      - Carrier, airline, or school system
      - Email
      - Muse
      - Useful push notification
    sections:
      - heading: The problem
        paragraphs:
          - >
            I ship a lot of packages to my dad in Guam. My wife ships a lot
            through Depop. The household uses USPS Informed Delivery. We're
            flying more. School notices are another stream. I don't want to
            check all of those places by hand, and I don't need a dashboard
            that says everything is fine.
      - heading: How I use it
        paragraphs:
          - >
            Email from carriers, airlines, and school systems goes into Muse.
            If something meaningful changed, I get a Muse push notification.
            If nothing changed, it stays silent. Muse isn't the source of
            truth. It's a consolidation and filtering layer over systems
            that already exist.
          - >
            Carriers and airlines already have their own notifications. The
            value is not better tracking data. It is one attention layer, and
            a rule about what is worth waking me up for.
          - >
            Weather monitoring is newer and still experimental. Appointments
            stay in Google Calendar. Prices are not part of this.
      - heading: What's being tuned
        paragraphs:
          - >
            New information is not automatically important information. A
            distribution-center scan is not the same as out for delivery. A
            generic school announcement is not the same as a teacher email
            that needs a form. Teacher praise is worth surfacing because I
            may want to open the email and reply myself. This workflow doesn't
            auto-reply.
    extra:
      summary: What counts as a meaningful change
      groups:
        - heading: Packages
          items:
            - shipped
            - delayed
            - out for delivery
            - delivery problems
            - cancellations
            - delivered
          note: I don't need every intermediate scan. I need to know the package actually gets there.
        - heading: Flights
          items:
            - gate changes
            - delays
            - cancellations
            - boarding
        - heading: School notices
          items:
            - teacher emails
            - events
            - deadlines
            - school closures
            - upcoming activities
            - forms
            - anything that needs an action from me
          note: "The useful question is whether this requires an action. Praise is the exception: surface it so I can reply in person."

learning:
  intro: >
    The useful systems so far started with something I already did by hand.
    I'm usually trying to figure out:
  questions:
    - what part requires repetitive attention
    - what context I keep having to explain
    - what information already exists in tools I use
    - what should happen automatically
    - when the system should stay silent
    - where I still want to make the decision myself


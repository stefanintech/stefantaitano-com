# Public status vocabulary: In use | Still tuning | Experimenting
# src/pages/ai.njk renders only some of these fields. The rest is the workflow record.
workflows:
  - slug: morning-briefing
    title: The Morning Briefing
    status: In use
    category: Daily operations
    tools:
      - Hermes
      - Proton Mail
      - Google Calendar
      - Apple Reminders
    primaryTools:
      - Hermes
      - Calendar
      - Email
      - Reminders
    question: What do I need to know and get done this week?
    schedule: Around 7:00 AM
    sources:
      - Google Calendar
      - Apple Reminders
      - Paper calendar
      - Email
    answers:
      - What's on the calendar this week?
      - What events matter?
      - What do I need to finish?
      - What forms, due dates, or action items need attention before the week is over?
    summary: >
      Every morning around 7 AM, my own assistant, Hermes, gives me one
      briefing that answers a simple question: what do I need to know and get
      done this week?
    flow:
      - Calendar + email + reminders
      - Hermes
      - Morning briefing
    notes:
      - heading: Why I built it
        paragraphs:
          - >
            That information lived in Google Calendar, Apple Reminders, a paper
            calendar, and email, and I was the one putting it together. Now the
            briefing is the first thing I read in the morning.
      - heading: Still tuning
        paragraphs:
          - >
            Hermes is new, so I'm still tuning it. Calendar, reminders, and
            email are still the source of truth.

  - slug: delegating-attention
    title: Delegating Attention
    status: Still tuning
    category: Monitoring
    tools:
      - Hermes
      - Proton Mail
      - Push notifications
    primaryTools:
      - Hermes
      - Email
    sources:
      - Carrier email
      - Store email
      - USPS Informed Delivery
    outOfScope:
      - Appointments stay in Google Calendar.
      - Prices are not part of this.
    summary: >
      Packages and orders all have their own notification streams. Hermes
      checks my mail at 7:30 AM and 5:30 PM, and a separate tracker follows
      orders and returns. Most of those checks are plain scripts, not AI. They
      tell me when something needs my attention and stay quiet when it doesn't.
    flow:
      - Email
      - Hermes
      - Useful notification
    rules:
      heading: What counts as a change
      groups:
        - heading: Packages
          items:
            - delayed
            - out for delivery
            - delivery problem
            - delivered
      silence: If nothing important changed, stay silent.
    notes:
      - paragraphs:
          - >
            Hermes isn't the source of truth. The carrier or store still is.
            It's read-only, so it can't reply to anything for me.

learning:
  intro: >
    The workflows that stuck all started with something I was already doing
    by hand. What I want from them is pretty specific: check things so I don't
    have to, remember where I left off, and stay quiet when nothing changed.
  questions:
    - what part requires repetitive attention
    - what context I keep having to explain
    - what information already exists in tools I use
    - what should happen automatically
    - when the system should stay silent
    - where I still want to make the decision myself

experiments:
  intro: >
    I started with a few Grok Bot projects. They're paused now, but they shaped
    what I want from personal AI. The crew above still runs on Grok Bot, and my
    own assistant, Hermes, runs on a small cloud server next to n8n, with
    nightly backups and a watchdog that pings my phone if anything breaks.
  items:
    - name: Ms. Frizzle / Mr. Frizzle
      note: home assistant
    - name: Marketplace / Resell Boss
      note: marketplace listing assistant
    - name: SLP Weather
      note: local weather bot

tools:
  - name: Hermes
    role: My own AI assistant, on a small server I rent
  - name: n8n
    role: Runs my automations next to Hermes
  - name: ChatGPT
    role: Research, writing, coding, and project work
  - name: Obsidian
    role: Notes
  - name: Proton Mail
    role: Email input for the briefing and the mail watch
  - name: Google Calendar
    role: Schedule input for the morning briefing
  - name: Apple Reminders
    role: Task input for the morning briefing

- title: Family Sticker Machine
  description: Say or type a sticker idea, get a black-and-white coloring-page image, and print it as a 4x6 label on a Phomemo thermal printer.
  status: Local app
  date: '2026'
  challenge: Give my kids a way to turn a spoken idea into a printable coloring sticker without building a whole platform around it.
  result: A small Flask app with hold-to-talk from a phone, Gemini image generation, and direct CUPS printing to a Phomemo PM-241BT.
  tech:
    - Python
    - Flask
    - Gemini
    - CUPS
  article: /articles/i-built-a-sticker-machine-for-my-kids/
  repo: https://github.com/stefanintech/family-sticker-app


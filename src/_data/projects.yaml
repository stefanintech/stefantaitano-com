- title: Asteroids Game
  description: A playable Asteroids clone I made while learning Python. It was my first real practice with classes, collision detection, and game state.
  status: Learning project
  date: '2026'
  challenge: Learn how Python objects work together by making something more interesting than another command-line exercise.
  result: A playable game and a much better grasp of classes, movement, and collision handling.
  tech:
    - Python
  repo: https://github.com/stefanintech/asteroids-game

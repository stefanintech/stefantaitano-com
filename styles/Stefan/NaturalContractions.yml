extends: substitution
message: "More formal than your usual conversational voice. Intentional? Consider '%s' instead of '%s'."
level: suggestion
ignorecase: false
swap:
  "I am": "I'm"
  "I did not": "I didn't"
  "I do not": "I don't"
  "I was not": "I wasn't"
  "I would not": "I wouldn't"
  "I cannot": "I can't"
  "it is": "it's"
  "It is(?! 2026 and I[’']m learning Ruby on Rails)": "It's"
  "that is": "that's"
  "That is": "That's"
  "there is": "there's"
  "There is": "There's"
  "we are": "we're"
  "We are": "We're"
